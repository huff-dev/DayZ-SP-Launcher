<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DayZ-SP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div id="window-controls">
        <button id="minimize">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5 12h14" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>

        <button id="close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M6 6l12 12M6 18L18 6" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>
    <div class="background-container">
      <div class="background-layer" id="bg-1"></div>
      <div class="background-layer" id="bg-2"></div>
    </div>
    <main class="app-shell">
      <section>
        <nav class="map-selector">
          <button class="map-option active" data-map="chernarus">Chernarus</button>
          <button class="map-option" data-map="livonia">Livonia</button>
          <button class="map-option" data-map="sakhal">
            Sakhal
          </button>
          <button class="map-option" data-map="custom">Custom</button>
        </nav>
      </section>

      <section class="content-container">
        <section class="mods-container">
          <div class="mods-header">
            <div class="mods-header-top">
              <div class="mods-import-wrapper">
                <button class="mods-import-btn" id="mods-import-btn" title="Import local mod">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <path d="M5 12h14M12 5v14"/>
                  </svg>
                </button>
                <div class="mods-import-menu" id="mods-import-menu"></div>
              </div>
              <div class="mods-label-wrapper" id="mods-label-wrapper">
                <span>Mods</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
                <div class="mods-sort-menu" id="mods-sort-menu"></div>
              </div>
              <div class="mods-header-dropdown">
                <button class="mods-dropdown-toggle" id="mods-dropdown-toggle"><span class="mods-dropdown-label">presets</span></button>
                <div class="mods-dropdown-menu" id="mods-dropdown-menu"></div>
              </div>
            </div>
          </div>
          <div class="mods-search-bar">
            <svg class="mods-search-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
            </svg>
            <input type="text" class="mods-search-input" id="mods-search-input" placeholder="Search mods...">
          </div>
          <div class="mods-table-wrap">
            <table class="mods-table">
              <thead>
                <tr>
                  <th class="col-enabled">Enabled</th>
                  <th class="col-name">Name</th>
                </tr>
              </thead>
              <tbody id="mods-list">
              </tbody>
            </table>
          </div>
      </section>
      <div class="right-column">
        <div class="saves-container">
          <h2 class="saves-header">Saves</h2>
          <div id="saves-list"></div>
        </div>
        <div class="options-container">
          <div class="options-header-wrapper">
            <h2 class="options-header">Options
              <button class="options-gear-btn" id="options-gear-btn" title="Edit server config">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                </svg>
              </button>
            </h2>
          </div>
          <div class="options-grid">
            <div class="option-item">
              <input type="checkbox" id="quick-join" />
              <label for="quick-join" class="option-label">Quick Join</label>
            </div>
            <div class="option-item">
              <input type="checkbox" id="disable-be" />
              <label for="disable-be" class="option-label">Disable BE</label>
            </div>
            <div class="option-item">
              <input type="checkbox" id="offline-mode" />
              <label for="offline-mode" class="option-label">Offline Mode</label>
            </div>
            <div class="option-item">
              <input type="checkbox" id="no-zombies" />
              <label for="no-zombies" class="option-label">No Zombies</label>
            </div>
          </div>
        </div>
        <div class="button-row">
          <button class="action-button">New Game</button>
          <button class="continue-button">Continue</button>
        </div>
        <div id="cf-confirm" class="confirm-container hidden">
          <p class="confirm-text">Loading CF mod on an existing save causes a memory leak, consider starting a new game with the mod enabled.</p>
          <div class="confirm-actions">
            <button id="cf-proceed" class="mini-button proceed">Proceed</button>
            <button id="cf-cancel" class="mini-button cancel">Cancel</button>
          </div>
        </div>
        <div id="error-dialog" class="confirm-container hidden">
          <div id="error-dialog-text" class="confirm-text error-scroll"></div>
          <div class="confirm-actions">
            <button id="error-dialog-copy" class="mini-button proceed">
              <span id="copy-btn-text">Copy</span>
              <span id="copy-check" class="copy-check">✓</span>
            </button>
            <button id="error-dialog-ok" class="mini-button proceed">OK</button>
          </div>
        </div>
      </div>
      </div>
      </section>
    </main>
    <footer class="status-bar" aria-live="polite">
      <div class="status-left">
        <svg id="loading-spinner" class="hidden" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" />
          <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span id="launch-status"></span>
        <a id="update-link" class="update-link hidden">Update available</a>
      </div>
      <div class="status-right">
        <div class="server-status" title="DayZ install status" id="open-game-folder">
          <span class="server-label">DayZ</span>
          <span
            class="server-indicator"
            data-game-indicator
            aria-label="Checking DayZ"
          ></span>
        </div>
        <div class="server-status" title="DayZ Server install status" id="open-server-folder">
          <span class="server-label">DayZ Server</span>
          <span
            class="server-indicator"
            data-server-indicator
            aria-label="Checking DayZ Server"
          ></span>
        </div>
        <span id="app-version" class="version-text"></span>
      </div>
    </footer>
    <div id="server-overlay" class="hidden"></div>
    <div id="config-overlay" class="hidden">
      <div class="config-overlay-content">
        <div class="config-overlay-titlebar">
          <div class="config-titlebar-left">
            <button id="config-sidebar-toggle" class="config-sidebar-toggle" title="Toggle sidebar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <path d="M3 6h18M3 12h18M3 18h18"/>
              </svg>
            </button>
            <button id="config-save-btn" class="config-save-btn" title="Save">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/>
              </svg>
            </button>
            <button id="config-bypass-btn" class="config-bypass-btn" title="Bypass launcher options (Manual mode):&#10;This button disables the launcher's features&#10;and allows you to edit everything manually">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 16L23 13L20 10V12H18.748C17.8599 8.54955 14.7277 6 11 6C7.27232 6 4.14012 8.54955 3.25203 12H1V14H5C5 10.6863 7.68629 8 11 8C14.3137 8 17 10.6863 17 14H20V16Z"/>
                <path d="M15 14C15 16.2091 13.2092 18 11 18C8.7909 18 7.00004 16.2091 7.00004 14C7.00004 11.7909 8.7909 10 11 10C13.2092 10 15 11.7909 15 14Z"/>
              </svg>
            </button>
          </div>
          <span id="config-filename-display" class="config-filename-display"></span>
          <button id="config-overlay-close" class="config-overlay-close" title="Close">&times;</button>
        </div>
        <div class="config-overlay-columns">
          <div class="config-overlay-left" id="config-overlay-left">
            <div class="config-file-row" data-file="DayzSPL.cfg">
              <span class="config-file-name">DayzSPL.cfg</span>
              <button class="config-restore-btn" title="Restore defaults">
                <svg viewBox="0 0 40 40" fill="currentColor">
                  <path d="M10 16.682l5.69 5.685 1.408-1.407-3.283-3.28h10.131c1.147 0 2.19.467 2.943 1.222a4.157 4.157 0 011.225 2.946 4.18 4.18 0 01-4.168 4.168h-5.628V28h5.522c3.387 0 6.16-2.77 6.16-6.157a6.117 6.117 0 00-1.81-4.343 6.143 6.143 0 00-4.35-1.805H13.815l3.283-3.285L15.69 11 10 16.682z"/>
                </svg>
              </button>
            </div>
            <div class="config-file-row" data-file="!DayzSPL.bat">
              <span class="config-file-name">!DayzSPL.bat</span>
              <button class="config-restore-btn" title="Restore defaults">
                <svg viewBox="0 0 40 40" fill="currentColor">
                  <path d="M10 16.682l5.69 5.685 1.408-1.407-3.283-3.28h10.131c1.147 0 2.19.467 2.943 1.222a4.157 4.157 0 011.225 2.946 4.18 4.18 0 01-4.168 4.168h-5.628V28h5.522c3.387 0 6.16-2.77 6.16-6.157a6.117 6.117 0 00-1.81-4.343 6.143 6.143 0 00-4.35-1.805H13.815l3.283-3.285L15.69 11 10 16.682z"/>
                </svg>
              </button>
            </div>
            <div class="config-file-row" data-file="!Dayz.bat">
              <span class="config-file-name">!Dayz.bat</span>
              <button class="config-restore-btn" title="Restore defaults">
                <svg viewBox="0 0 40 40" fill="currentColor">
                  <path d="M10 16.682l5.69 5.685 1.408-1.407-3.283-3.28h10.131c1.147 0 2.19.467 2.943 1.222a4.157 4.157 0 011.225 2.946 4.18 4.18 0 01-4.168 4.168h-5.628V28h5.522c3.387 0 6.16-2.77 6.16-6.157a6.117 6.117 0 00-1.81-4.343 6.143 6.143 0 00-4.35-1.805H13.815l3.283-3.285L15.69 11 10 16.682z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="config-overlay-right"></div>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
