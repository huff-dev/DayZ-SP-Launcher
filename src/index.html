<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DayZ-SP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div id="window-controls">
        <button id="minimize">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5 12h14" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>

        <button id="close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M6 6l12 12M6 18L18 6" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>
    <div class="background-container">
      <div class="background-layer" id="bg-1"></div>
      <div class="background-layer" id="bg-2"></div>
    </div>
    <main class="app-shell">
      <section class="top-section">
        <nav class="map-selector">
          <button class="map-option active" data-map="chernarus">Chernarus</button>
          <button class="map-option" data-map="livonia">Livonia</button>
          <button class="map-option" data-map="sakhal">
            Sakhal
            <svg class="lock-icon hidden" viewBox="0 0 24 24" fill="currentColor">
              <!-- Body -->
              <rect x="6" y="10" width="12" height="9" rx="2"></rect>

              <!-- Shackle -->
              <path d="M9 10V8a3 3 0 1 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </nav>
      </section>

      <section class="content-container">
        <section class="mods-container">
          <h2 class="mods-header">Mods</h2>
          <table class="mods-table">
            <thead>
              <tr>
                <th class="col-enabled">Enabled</th>
                <th class="col-name">Name</th>
              </tr>
            </thead>
            <tbody id="mods-list">
              <!-- Mods will be injected here -->
            </tbody>
          </table>
      </section>
      <div class="right-column">
        <div class="workshop-container">
          <img src="images/workshop.jpg" alt="Workshop" class="workshop-image" />
          <button class="workshop-button" id="workshop-btn">Visit Workshop</button>
        </div>
        <section class="controls-container">
          <h2 class="controls-header">Options</h2>
          <div class="control-options">
            <label class="control-checkbox">
              <input type="checkbox" id="opt1" />
              <span>First Person Only</span>
            </label>
            <label class="control-checkbox">
              <input type="checkbox" id="opt2" />
              <span>Disable Third Person</span>
            </label>
            <label class="control-checkbox">
              <input type="checkbox" id="opt3" />
              <span>Enable Crosshairs</span>
            </label>
            <label class="control-checkbox">
              <input type="checkbox" id="opt4" />
              <span>Disable Damage</span>
            </label>
          </div>
        </section>
        <button class="continue-button">Continue</button>
        <button class="action-button">New Game</button>
      </div>
      </section>
    </main>
    <footer class="status-bar" aria-live="polite">
      <div class="status-left">
        <svg id="loading-spinner" class="hidden" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" />
          <path class="opacity-75" d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span id="launch-status"></span>
      </div>
      <div class="status-right">
        <div class="server-status" title="DayZ install status">
          <span class="server-label">DayZ</span>
          <span
            class="server-indicator"
            data-game-indicator
            aria-label="Checking DayZ"
          ></span>
        </div>
        <div class="server-status" title="DayZ Server install status">
          <span class="server-label">DayZ Server</span>
          <span
            class="server-indicator"
            data-server-indicator
            aria-label="Checking DayZ Server"
          ></span>
        </div>
      </div>
    </footer>
    <script src="./renderer.js"></script>
  </body>
</html>
